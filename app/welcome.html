<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Ring</title>
<style>
  /* First launch only: the "fire" signature writes itself on system glass. */
  :root { color-scheme: dark; --ink: #f7c46a; --flash: #fff3d6; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --ink: #b87410; --flash: #b87410; } }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; }
  svg { width: 78%; height: auto; filter: drop-shadow(0 0 18px rgba(247,196,106,.28)); }
  @media (prefers-color-scheme: light) { svg { filter: none; } }
</style>
</head>
<body>
<svg id="sig" role="img" aria-label="fire"></svg>
<script src="brand/signature.js"></script>
<script>
  const style = getComputedStyle(document.documentElement);
  const done = () => window.webkit?.messageHandlers?.welcome?.postMessage({ kind: 'done' });
  try {
    const sig = FireSignature.mount(document.getElementById('sig'), 'fire', {
      color: style.getPropertyValue('--ink').trim(),
      flash: style.getPropertyValue('--flash').trim(),
    });
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(done, ((still ? 0 : sig.duration) + (still ? 1.6 : 0.8)) * 1000);
  } catch (error) {
    done();
  }
</script>
</body>
</html>
